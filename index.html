<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Mappemonde</title>
<meta name="description" content="Votre carte du monde : pays visités, vécus et envies. Globe 3D, statistiques et badges.">
<meta name="theme-color" content="#0b0c0a" id="themeColor">
<meta name="color-scheme" content="dark light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mappemonde">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preload" href="fonts/instrument-serif-latin-400-italic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/figtree-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="data/world-lite.json" as="fetch" crossorigin>
<link rel="stylesheet" href="styles.css?v=3">
<script>
  (function(){try{var s=JSON.parse(localStorage.getItem('mappemonde.v2')||'{}');var t=s.theme||'auto';if(t==='auto')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=t;}catch(e){}})();
</script>
</head>
<body>
<div id="app" data-view="map">
  <div class="stage" id="stage">
    <div class="sky" id="sky"><div class="stars s1"></div><div class="stars s2"></div></div>
    <canvas id="map" aria-label="Carte du monde. Touchez un pays pour le marquer." role="img"></canvas>
  </div>

  <header class="top">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="12.5" fill="none" stroke="currentColor" stroke-width="1.3"/><ellipse cx="16" cy="16" rx="5.4" ry="12.5" fill="none" stroke="currentColor" stroke-width="1.1" opacity=".7"/><path d="M3.5 16h25M6 9.5h20M6 22.5h20" stroke="currentColor" stroke-width="1" opacity=".45" fill="none"/></svg>
      <h1>Mappemonde</h1>
    </div>
    <button class="counter" id="counter" aria-label="Voir les statistiques">
      <span class="cnt"><b id="cnt">0</b><span class="of">/197</span></span>
      <small id="pct">0 % du monde</small>
    </button>
    <div class="progress" aria-hidden="true"><i id="progbar"></i></div>
  </header>

  <main>
    <section class="view view-map" id="v-map" aria-label="Carte">
      <div class="seg mode" id="modeSeg" role="tablist" aria-label="Type de carte">
        <i class="seg-ind"></i>
        <button role="tab" data-mode="globe">Globe</button>
        <button role="tab" data-mode="flat">Plan</button>
      </div>
      <div class="ctrls">
        <button class="ctrl" id="zsearch" aria-label="Rechercher un pays"></button>
        <button class="ctrl" id="zin" aria-label="Zoom avant"></button>
        <button class="ctrl" id="zout" aria-label="Zoom arrière"></button>
        <button class="ctrl" id="zreset" aria-label="Recentrer"></button>
        <button class="ctrl surprise" id="zsurp" aria-label="Surprise : un pays à découvrir"></button>
      </div>
      <button class="legend" id="legend" aria-label="Changer la coloration de la carte"></button>
      <div class="msearch" id="msearch" role="dialog" aria-label="Recherche">
        <div class="msearch-bar card"><span class="ms-ic"></span><input id="mq" type="text" placeholder="Pays, capitale, code…" autocomplete="off" enterkeyhint="go" aria-label="Rechercher un pays"><button class="iconbtn" id="mqx" aria-label="Fermer la recherche"></button></div>
        <div class="msearch-res card" id="mres" role="listbox"></div>
      </div>
      <div class="replay" id="replay" aria-live="polite"></div>
      <div class="hint" id="hint"></div>
      <div class="peek" id="peek" aria-live="polite"></div>
    </section>

    <section class="view page" id="v-list" aria-label="Pays"></section>
    <section class="view page" id="v-journal" aria-label="Journal"></section>
    <section class="view page" id="v-stats" aria-label="Statistiques"></section>
    <section class="view page" id="v-more" aria-label="Réglages"></section>
  </main>

  <nav class="tabbar" id="tabbar" aria-label="Navigation">
    <i class="tab-ind" id="tabInd"></i>
    <button data-view="map" class="tab"><span class="ti" data-icon="globe"></span><span>Carte</span></button>
    <button data-view="list" class="tab"><span class="ti" data-icon="list"></span><span>Pays</span></button>
    <button data-view="journal" class="tab"><span class="ti" data-icon="book"></span><span>Journal</span></button>
    <button data-view="stats" class="tab"><span class="ti" data-icon="chart"></span><span>Stats</span></button>
    <button data-view="more" class="tab"><span class="ti" data-icon="sliders"></span><span>Réglages</span></button>
  </nav>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="grab" id="grab"><i></i></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
  <div class="toast" id="toast" role="status"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>
</div>
<script type="module" src="js/app.js?v=3"></script>
</body>
</html>
